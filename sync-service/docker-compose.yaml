services:
  sync-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://sync:sync@postgres:5432/vaatflow_sync
      SYNC_JWT_SECRET: ${SYNC_JWT_SECRET:-change-me-in-production}
      SYNC_ENCRYPTION_KEY: ${SYNC_ENCRYPTION_KEY}
      SYNC_ADMIN_EMAIL: ${SYNC_ADMIN_EMAIL:-admin@vaatflow.com}
      SYNC_ADMIN_PASSWORD: ${SYNC_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: vaatflow_sync
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
