# Allo Appliance — Self-contained Docker deployment
# Usage: docker compose up -d
#
# Services:
#   - postgres:    PostgreSQL 16 database (persistent via pgdata volume)
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables:
#   POSTGRES_PASSWORD                — database password, default deerflow_secret
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   DEER_FLOW_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   DEER_FLOW_REPO_ROOT              — repo root (used for skills host path in DooD)
#
# Data is stored in named volumes (pgdata, appdata). Config files are embedded
# in the image and copied to appdata on first boot if not already present.
#
# LangSmith tracing is disabled by default (LANGCHAIN_TRACING_V2=false).
# Set LANGCHAIN_TRACING_V2=true and LANGSMITH_API_KEY in environment to enable.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deer-flow-postgres
    environment:
      POSTGRES_DB: deerflow
      POSTGRES_USER: deerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deerflow_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - deer-flow
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deerflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
      - langgraph
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
    container_name: deer-flow-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=postgresql://deerflow:${POSTGRES_PASSWORD:-deerflow_secret}@postgres:5432/deerflow
      - ALLO_MODE=appliance
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: deer-flow-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ../skills:/app/skills:ro
      # DooD: AioSandboxProvider starts sandbox containers via host Docker daemon
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    working_dir: /app
    environment:
      - CI=true
      - ALLO_MODE=appliance
      - DATABASE_URL=postgresql+asyncpg://deerflow:${POSTGRES_PASSWORD:-deerflow_secret}@postgres:5432/deerflow
      - DEER_FLOW_HOME=/app/data/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/data/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/data/extensions_config.json
      # DooD path/network translation
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped

  # ── LangGraph Server ───────────────────────────────────────────────────────
  # TODO: switch to langchain/langgraph-api (licensed) once a license key is available.
  # For now, use `langgraph dev` (no license required) with the standard backend image.
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: deer-flow-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ../skills:/app/skills:ro
      # DooD: same as gateway
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - CI=true
      - ALLO_MODE=appliance
      - DATABASE_URL=postgresql+asyncpg://deerflow:${POSTGRES_PASSWORD:-deerflow_secret}@postgres:5432/deerflow
      - DEER_FLOW_HOME=/app/data/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/data/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/data/extensions_config.json
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # Disable LangSmith tracing — LANGSMITH_API_KEY is not required.
      # Set LANGCHAIN_TRACING_V2=true and LANGSMITH_API_KEY in environment to enable.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${DEER_FLOW_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  deer-flow:
    driver: bridge

volumes:
  pgdata:
  appdata:
